[routers]
# Router 1 usará las variables del Túnel 1
router1 ansible_host=10.200.1.3 wan_ip=200.200.200.2 tunnel_ip="{{ aws_tunnel1_ip }}" tunnel_psk="{{ aws_tunnel1_psk }}" bgp_ip="{{ aws_tunnel1_bgp_ip }}" internal_tunnel_ip="{{ aws_tunnel1_cgw_ip }}"
router2 ansible_host=10.200.1.2 wan_ip=200.200.200.5 tunnel_ip="{{ aws_tunnel2_ip }}" tunnel_psk="{{ aws_tunnel2_psk }}" bgp_ip="{{ aws_tunnel2_bgp_ip }}" internal_tunnel_ip="{{ aws_tunnel2_cgw_ip }}"
[routers:vars]
ansible_user=oscar
ansible_password=oscar
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli

ansible_ssh_common_args='-o HostKeyAlgorithms=+ssh-rsa -o KexAlgorithms=+diffie-hellman-group14-sha1 -o PubkeyAcceptedKeyTypes=+ssh-rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

