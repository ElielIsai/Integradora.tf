---
- name: Instalar y Configurar AWS Elastic Disaster Recovery (DRS) Agent
  hosts: debian_BD
  become: yes
  vars:
    # Estas variables vendrán de Jenkins (del nuevo output de Terraform)
    aws_access_key_drs: "{{ aws_access_key_drs_env | default('') }}"
    aws_secret_key_drs: "{{ aws_secret_key_drs_env | default('') }}"
    aws_region: "us-east-1"

  tasks:
    - name: Instalar dependencias para compilar el agente
      apt:
        name:
          - gcc
          - make
          - linux-headers-amd64
          - build-essential
        state: present
        update_cache: yes

    - name: Descargar el instalador de AWS DRS (Python script)
      get_url:
        url: "https://aws-elastic-disaster-recovery-{{ aws_region }}.s3.{{ aws_region }}.amazonaws.com/latest/linux/aws-replication-installer-init.py"
        dest: "/tmp/aws-replication-installer-init.py"
        mode: "0755"

    - name: Instalar el agente de DRS usando el script de AWS
      # El script de python de AWS hace todo el trabajo pesado.
      command: >
        python3 /tmp/aws-replication-installer-init.py 
        --region {{ aws_region }} 
        --aws-access-key-id {{ aws_access_key_drs }} 
        --aws-secret-access-key {{ aws_secret_key_drs }} 
        --no-prompt
        --devices /dev/sda
      register: drs_install_result
      changed_when: "'Successfully installed' in drs_install_result.stdout"

    - name: Mostrar resultado de la instalacion de DRS
      debug:
        msg: "{{ drs_install_result.stdout_lines }}"
